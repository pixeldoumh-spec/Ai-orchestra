name: CI
on:
  push:
  pull_request:

jobs:
  quality:
    # V5 enterprise release gate.
    # Post-merge main verification.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install
      - run: npm run test:core
      - run: npm run typecheck
      - run: npm run build
